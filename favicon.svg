<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <filter id="soft-shadow" x="-20%" y="-20%" width="145%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#ff70ae" flood-opacity="0.22" />
    </filter>
    <radialGradient id="pink-gradient" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffb3cf" />
      <stop offset="45%" stop-color="#ff66a3" />
      <stop offset="85%" stop-color="#f03e85" />
      <stop offset="100%" stop-color="#d6246c" />
    </radialGradient>
    <linearGradient id="white-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fdf0f4" />
    </linearGradient>
  </defs>

  <!-- Puffy White Outline/Base (Cloud-like Heart Container) -->
  <path d="M256 465 C220 435 110 338 72 284 C38 235 34 165 72 118 C110 70 185 64 228 114 L256 146 L284 114 C327 64 402 70 440 118 C478 165 474 235 440 284 C402 338 292 435 256 465 Z" 
        fill="url(#white-cloud)" 
        stroke="#ffd3e2" 
        stroke-width="12" 
        filter="url(#soft-shadow)" />

  <!-- Inner Puffy Pink Balloon/Plush Heart -->
  <path d="M256 422 C226 397 136 319 105 275 C78 235 75 181 105 143 C136 104 197 99 233 140 L256 166 L279 140 C315 99 376 104 407 143 C437 181 434 235 407 275 C376 319 286 397 256 422 Z" 
        fill="url(#pink-gradient)" />

  <!-- Heart Gloss Highlight (Left-side top bubble) -->
  <path d="M195 145 C175 150 155 165 145 188 C140 199 138 215 144 228 C145 230 148 231 150 229 C152 227 151 224 150 222 C146 212 148 200 152 191 C161 172 177 160 195 154 C198 153 200 150 199 147 C198 145 196 144 195 145 Z" 
        fill="#ffffff" 
        opacity="0.65" />

  <!-- Heart Soft Glow Highlight (Right-side soft vertical sheen) -->
  <path d="M365 155 C385 170 392 195 388 225" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="10" 
        stroke-linecap="round" 
        opacity="0.30" />
</svg>
